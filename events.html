<!DOCTYPE html>
<html>
    <head>
        <title>Event Handlers & Onmouseout</title>
    </head>
    <body>
        <input type="text" placeholder="Enter new text" id="input" onmouseout="abc()">
        <script>
            function abc() {
                var x = document.getElementById("input");
                alert(x.value);
            }
        </script>
    </body>
</html>
