                products=res.data
                console.log(res);
                gen(products.data);

                var li1=document.createElement("li");
                var li2=document.createElement("li");
                arr.data.forEach(element => {
                    li1.innerHTML=element.status;
                    console.log(element.data)
                    lu.appendChild(li1)
                });
            }
        </script>
    </body>
