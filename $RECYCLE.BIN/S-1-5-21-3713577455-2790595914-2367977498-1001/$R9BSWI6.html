<script>
    function formatTimeAgo(date) {
    const now = new Date();
    const secondsAgo = Math.floor((now - date) / 1000);
    
    const minutesAgo = Math.floor(secondsAgo / 60);
    const hoursAgo = Math.floor(minutesAgo / 60);
    const daysAgo = Math.floor(hoursAgo / 24);
    const monthsAgo = now.getMonth() - date.getMonth() + (12 * (now.getFullYear() - date.getFullYear()));
    
    if (secondsAgo < 60) {
        return secondsAgo === 1 ? "1 second ago" : `${secondsAgo} seconds ago`;
    } else if (minutesAgo < 60) {
        return minutesAgo === 1 ? "1 minute ago" : `${minutesAgo} minutes ago`;
    } else if (hoursAgo < 24) {
        return hoursAgo === 1 ? "1 hour ago" : `${hoursAgo} hours ago`;
    } else if (monthsAgo < 12) {
        return monthsAgo === 1 ? "1 month ago" : `${monthsAgo} months ago`;
    } else {
        return Math.floor(monthsAgo / 12) === 1 ? "1 year ago" : `${Math.floor(monthsAgo / 12)} years ago`;
    }
}

// Example usage:
const eventDate = new Date('2024-01-01T10:00:00'); // Change this to your event date
console.log(formatTimeAgo(eventDate)); // Outputs the time since the event

</script>
